- claim_id: CLM-08-70ac2035
  project_location: 00-foundations/citation-sheet.md § Envelope 08 — Imam al-Kadhim
  env: 08
  item: letter/panel
  claim_text: About a year of it was in Basra, before Baghdad
  status: V
  work_hint: Qarashi, *The Life of Imam Musa bin Ja'far al-Kazim
  ref_hint: Ch. "The Imam is carried to Baghdad", opening — *"stayed in the detention of 'Isa for a year"
  translator_hint: Jasim al-Rasheed (Ansariyan)
  notes: ⚠ **This corrected a printed line.** The letter opened *"held in a prison in Baghdad for about
    four years"*, which puts the whole span in the wrong city — roughly the first year was Basra, in 'Isa
    b. Ja'far's custody, and Baghdad came after. Fixed to *"held in prison, moved from city to city, for
    about four years"*; count re-measured, 357 → 359 words, still in range. **The fact panel was already
    right** (*"Medina for most of it, then Basra and Baghdad"*), so the two disagreed with each other
    and nobody had noticed.
