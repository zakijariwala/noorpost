- claim_id: CLM-13-c9e3ec0d
  project_location: 00-foundations/citation-sheet.md § Envelope 13 — Imam al-Rida
  env: '13'
  item: letter
  claim_text: Imam al-Rida's four conditions for accepting the succession — he would appoint nobody, dismiss
    nobody, change nothing already in place, and give no opinion unless asked
  status: V
  work_hint: Uyun Akhbar al-Rida, vol. 2
  ref_hint: 'Three passages, all in vol. 2 of the fixed edition: the conditions as written to al-Ma''mun;
    the "distant advisor" statement; and his later reminder to al-Ma''mun when pressed to name a governor.
    Cite the second as primary. Page numbers pending — see the two-column/edition caveat in `sourcing-rules.md`;
    this edition''s own internal chapter-and-report numbering is the stable reference, not the PDF page.'
  translator_hint: Dr. Ali Peiravi
  notes: 'Primary support: *"I will accept it under the condition that I do not interfere in dismissals
    or appointments, nor change any practices or traditions. I will just be a distant advisor."* Corroborated
    by: *"I will neither issue any orders, nor will I admonish anyone. I will not remove anyone from office,
    neither will I appoint anyone."* A third passage phrases the same conditions differently (*"I neither
    issue any orders, nor do I admonish against anything; I neither judge, nor change anything"*). **All
    three are the same event; the draft letter line is supported and stands.** ⚠ **2026-08-12 correction:**
    an earlier pass read only the third passage, wrongly recorded the draft as unsupported, and rewrote
    the printed line. Reverted. Lesson: a differently-worded passage is not disproof — search the whole
    work before cutting a line.'
  created_from: citation-sheet.md
