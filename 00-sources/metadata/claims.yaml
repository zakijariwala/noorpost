- claim_id: CLM-08-ebda3d88
  project_location: 00-foundations/citation-sheet.md § Envelope 08 — Imam al-Kadhim
  env: 08
  item: panel
  claim_text: Died 183 AH
  status: CONT
  work_hint: contested inside the source itself
  ref_hint: §22 "The Time of his Death"
  translator_hint: Jasim al-Rasheed (Ansariyan)
  notes: ⚠ **The held work does not support 183 in its own headline.** §22 gives *"Rajab 25, in the year
    173 A. H."* as the famous narration, then names 181 and 186 as variants. **173 is impossible against
    this same book's arrest date of 179** and is almost certainly a digit error for 183; 183 appears in
    the book only inside a quotation from Dr. Muhammed Yousif Musa. **Do not print 183 on this source
    alone.** Check a physical copy of §22, or source the death date from Uyun or al-Irshad. The `AH →
    CE` table row for 183 is unaffected either way — but if the date moves, the death line, the panel
    dateline and that row all move together.
