  claim_text: Held about four years without charge
  status: TRAD
  work_hint: Qarashi, *The Life of Imam Musa bin Ja'far al-Kazim
  ref_hint: 'Computed: arrest Shawwal 179 → death 183 ≈ 3 years 9 months'
  translator_hint: Jasim al-Rasheed (Ansariyan)
  notes: '**"About four years" holds and all three places agree.** It is not `V` because the number is
