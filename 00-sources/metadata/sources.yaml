# Source manifest — machine-readable, and the thing the database is built from.
#
# ⛔ SHIA SOURCES ONLY. See 00-foundations/sourcing-rules.md. Works removed under
#    that rule are in rejected.yaml and may never appear in this file.
#
# Two levels:
#   works     — the work itself (Tuhaf al-Uqul), independent of any printing
#   editions  — the physical thing a page number belongs to, one per volume.
#               source_id identifies an EDITION, because that is what a
#               citation has to name. SRC-NHB-001 and SRC-NHB-002 are the two
#               parts of one work and are not interchangeable.
#
# status
#   fixed                 this exact edition is the project's citation of record,
#                         it is complete, and its translator is confirmed
#   candidate             held, usable for locating material, not fixed
#   verification-required something about it is known to be wrong or incomplete
#   missing               needed, not held
#   rejected              never usable (kept only so the guard can refuse it)
#
# pagination — decides whether a page number may be cited at all
#   printed        [[p N]] tracks the printed page
#   web-generated  pagination is an artifact of PDF generation (al-islam.org).
#                  Cite the work's own internal numbering. Trap 2, HANDOVER.md.
#   two-column     one [[p N]] covers two book pages. Trap 1, HANDOVER.md.
#   unknown        not established — do not cite a page number
#
# sha256 is of the ORIGINAL PDF. Where it is null the PDF was placed by hand
# before manifest.json existed; run
#     python tools/build_source_corpus.py --hash-originals
# on a machine that has 00-sources/*.pdf to fill it in.

